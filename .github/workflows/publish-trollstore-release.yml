name: Publish TrollStore TIPA to Release

on:
  workflow_run:
    workflows: ["Build TrollStore TIPA (iPhone SE 3 / iOS 15.4)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Actions run id to publish from (empty uses the latest successful build)
        required: false
        default: ''
        type: string
      tag:
        description: Release tag
        required: false
        default: 'trollstore-iphone-se3-ios15.4'
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-trollstore-release.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-trollstore-release
  cancel-in-progress: false

env:
  ARTIFACT_NAME: Reynard-TrollStore.tipa
  RELEASE_TAG: trollstore-iphone-se3-ios15.4

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source run
        id: source
        uses: actions/github-script@v9
        with:
          script: |
            const explicit = context.payload.inputs?.source_run_id;
            const fromWorkflowRun = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.id
              : null;

            if (explicit || fromWorkflowRun) {
              core.setOutput('run_id', String(explicit || fromWorkflowRun));
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 30,
            });
            const run = data.workflow_runs.find(item =>
              item.name === 'Build TrollStore TIPA (iPhone SE 3 / iOS 15.4)' &&
              item.conclusion === 'success'
            );

            if (!run) {
              core.setFailed('No successful build run found; supply source_run_id manually.');
              return;
            }
            core.info(`Publishing from run ${run.id}`);
            core.setOutput('run_id', String(run.id));

      - name: Download universal TIPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Verify downloaded package
        run: |
          set -euo pipefail
          file="dist/$ARTIFACT_NAME"
          test -s "$file"
          unzip -tqq "$file"
          echo "Verified $file ($(du -h "$file" | cut -f1))"

      - name: Keep only one release asset
        uses: actions/github-script@v9
        env:
          TAG: ${{ inputs.tag || env.RELEASE_TAG }}
          WANTED: ${{ env.ARTIFACT_NAME }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            const wanted = process.env.WANTED;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status === 404) {
                core.info(`Release ${tag} does not exist yet; nothing to clean up.`);
                return;
              }
              throw error;
            }
            for (const asset of release.assets) {
              if (asset.name === wanted) continue;
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              core.info(`Removed stale asset ${asset.name}`);
            }

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || env.RELEASE_TAG }}
          name: Reynard — TrollStore (universal arm64)
          body: |
            Universal TrollStore build of Reynard. This package is not device-specific.

            - Source Actions run: ${{ steps.source.outputs.run_id }}
            - arm64, no device restrictions, `MinimumOSVersion` ≤ 15.4 (verified in CI)
            - Includes the TrollStore JIT helper (`ts_ptrace_jit`)
            - Install with TrollStore on iOS 14 - 16.6.1 or 17.0; iPhone SE 3 on iOS 15.4 is one supported target
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/${{ env.ARTIFACT_NAME }}
          token: ${{ github.token }}

      - name: Summary
        run: |
          {
            echo "### Published TrollStore TIPA"
            echo ""
            echo "Universal artifact \`$ARTIFACT_NAME\` from run ${{ steps.source.outputs.run_id }} is the only asset of release \`${{ inputs.tag || env.RELEASE_TAG }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
